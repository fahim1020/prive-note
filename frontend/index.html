<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Private Note - Secure Your Thoughts</title>
    <meta name="description" content="Secure private note application" />
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 600px;
        width: 100%;
      }

      .logo-section {
        margin-bottom: 40px;
        animation: slideDown 0.6s ease-out;
      }

      .logo-section h1 {
        font-size: 3rem;
        font-weight: 700;
        color: white;
        margin-bottom: 10px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      .logo-section p {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 300;
        letter-spacing: 0.5px;
      }

      .cards-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 40px;
        animation: fadeIn 0.8s ease-out 0.2s backwards;
      }

      .card {
        background: white;
        border-radius: 15px;
        padding: 30px 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      }

      .card.create-card {
        border-top: 4px solid #10b981;
      }

      .card.create-card:hover {
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.1),
          rgba(16, 185, 129, 0.05)
        );
      }

      .card.read-card {
        border-top: 4px solid #f59e0b;
      }

      .card.read-card:hover {
        background: linear-gradient(
          135deg,
          rgba(245, 158, 11, 0.1),
          rgba(245, 158, 11, 0.05)
        );
      }

      .card-icon {
        font-size: 2.5rem;
        margin-bottom: 15px;
      }

      .card.create-card .card-icon {
        color: #10b981;
      }

      .card.read-card .card-icon {
        color: #f59e0b;
      }

      .card-title {
        font-size: 1.3rem;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 8px;
      }

      .card-desc {
        font-size: 0.9rem;
        color: #6b7280;
        line-height: 1.5;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 600px) {
        .cards-grid {
          grid-template-columns: 1fr;
          gap: 15px;
        }

        .logo-section h1 {
          font-size: 2.2rem;
        }

        .logo-section p {
          font-size: 1rem;
        }

        .card {
          padding: 25px 15px;
        }

        .card-title {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-section">
        <h1>🔒 Private Note</h1>
        <p>Keep your thoughts secure and private</p>
      </div>

      <div class="cards-grid">
        <a href="/create.html" class="card create-card">
          <span class="material-symbols-outlined card-icon">edit_note</span>
          <div class="card-title">Create Note</div>
          <div class="card-desc">
            Create a new secure note with password protection
          </div>
        </a>

        <a href="/read.html" class="card read-card">
          <span class="material-symbols-outlined card-icon">mail_lock</span>
          <div class="card-title">Read Note</div>
          <div class="card-desc">
            Access your existing notes with your password
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
