<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Note - Private Note</title>
    <meta name="description" content="Secure private note reader" />
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon" />
  </head>
  <body class="read-page">
    <a href="/" class="back-link">
      <span class="material-symbols-outlined">arrow_back</span>
      Back
    </a>

    <div class="container">
      <div class="header">
        <h1>🔍 Read Note</h1>
        <p>Enter your note details to access it</p>
      </div>

      <div class="form-card">
        <form id="readForm">
          <div class="form-group">
            <label for="name">Note Name</label>
            <input
              type="text"
              id="name"
              placeholder="Enter note name..."
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password..."
              required
            />
          </div>

          <button type="button" class="submit-btn" onclick="readNote()">
            Read Note
          </button>
        </form>

        <div class="status" id="status" style="display: none"></div>
      </div>
    </div>

    <script>
      async function readNote() {
        let noteName = document.getElementById("name").value;
        let notePass = document.getElementById("password").value;
        let statusEl = document.getElementById("status");

        if (noteName !== "" && notePass !== "") {
          statusEl.style.display = "flex";
          statusEl.className = "status info";
          statusEl.innerText = "Loading your note...";

          try {
            const URL = "https://prive-note-server.vercel.app/api/read-note";
            let body = {
              name: noteName,
              password: notePass,
            };
            let requestOptions = {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            };
            let response = await fetch(URL, requestOptions);

            if (response.ok) {
              let data = await response.json();
              // Store password in sessionStorage (only for this browser session)
              sessionStorage.setItem("notePassword", notePass);
              const queryParams = new URLSearchParams({
                name: noteName,
              });
              window.location.href = `/openpage.html?${queryParams}`;
            } else {
              let data = await response.json();
              statusEl.className = "status error";
              statusEl.innerText =
                "✗ " + (data.message || "Failed to read note");
            }
          } catch (error) {
            console.error("Error reading note:", error);
            statusEl.className = "status error";
            statusEl.innerText = "✗ Error reading note";
          }
        } else {
          statusEl.style.display = "flex";
          statusEl.className = "status error";
          statusEl.innerText = "✗ Please fill all fields";
        }
      }
    </script>
  </body>
</html>
