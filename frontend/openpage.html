<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Note - Private Note</title>
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon" />
  </head>
  <body class="open-page">
    <div class="header">
      <h1>📖 Your Note</h1>
      <p>Your private note is displayed below</p>
    </div>

    <div class="container">
      <div class="note-card">
        <div class="status-bar" id="noteStatus"></div>

        <div class="meta-grid">
          <div class="meta-item">
            <div class="meta-label">📅 Created</div>
            <div class="meta-value" id="date">Loading...</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">🏷️ Name</div>
            <div class="meta-value" id="noteName">Loading...</div>
          </div>
        </div>

        <div class="note-section">
          <div class="section-label">📝 Content</div>
          <textarea
            id="note"
            class="note-textarea"
            disabled
            placeholder="Loading your note..."
          ></textarea>
        </div>

        <div class="button-group">
          <a href="/" class="btn btn-home">
            <span class="material-symbols-outlined">arrow_back</span>
            Back to Home
          </a>
        </div>
      </div>
    </div>
    <script>
      let params = new URLSearchParams(window.location.search);
      let noteName = params.get("name");
      // Get password from sessionStorage instead of URL (more secure)
      let notePass = sessionStorage.getItem("notePassword");

      async function noteNameAndPass(noteName, notePass) {
        // Check if password is available
        if (!notePass) {
          document.getElementById("noteStatus").innerText = "❌ Password not found. Please go back and try again.";
          return;
        }

        try {
          const URL = "https://prive-note-server.vercel.app/api/read-note";
          let body = {
            name: noteName,
            password: notePass,
          };
          let requestOptions = {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          };
          let response = await fetch(URL, requestOptions);
          let data = await response.json();

          if (response.ok) {
            document.getElementById("date").innerText = new Date(data.createdAt).toLocaleString();
            document.getElementById("noteName").innerText = data.name;
            document.getElementById("note").value = data.note;
            document.getElementById("noteStatus").innerText =
              "⚠️ Don't share your notes with anyone";
          } else if (response.status === 404) {
            document.getElementById("noteStatus").innerText = "❌ Note not found";
          } else {
            document.getElementById("noteStatus").innerText = data.message || "Error loading note";
          }
        } catch (error) {
          console.error("Error reading note:", error);
          document.getElementById("noteStatus").innerText =
            "❌ Error loading your note";
        }
      }

      // Call function with credentials
      if (noteName && notePass) {
        noteNameAndPass(noteName, notePass);
      } else {
        document.getElementById("noteStatus").innerText = "❌ Missing note information. Please go back and try again.";
      }
    </script>

</html>
