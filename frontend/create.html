<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Note - Private Note</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./css/output.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="shortcut icon" href="logo.jpeg" type="image/x-icon" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 20px;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 30px;
        margin-top: 20px;
      }

      .header h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1rem;
        opacity: 0.9;
        font-weight: 300;
      }

      .container {
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .form-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: slideUp 0.5s ease-out;
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-group label {
        display: block;
        font-size: 0.95rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 8px;
      }

      textarea,
      input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e5e7eb;
        border-radius: 10px;
        font-family: "Segoe UI", sans-serif;
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      textarea {
        resize: vertical;
        min-height: 200px;
      }

      textarea:focus,
      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .status {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 8px;
        text-align: center;
        font-weight: 600;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status.success {
        background: #d1fae5;
        color: #065f46;
      }

      .status.error {
        background: #fee2e2;
        color: #7f1d1d;
      }

      .status.info {
        background: #dbeafe;
        color: #0c2340;
      }

      .back-link {
        color: white;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
        margin-left: 20px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
      }

      .back-link:hover {
        opacity: 0.8;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 600px) {
        .header h1 {
          font-size: 2rem;
        }

        .form-card {
          padding: 25px;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        textarea {
          min-height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <a href="/" class="back-link">
      <span class="material-symbols-outlined">arrow_back</span>
      Back
    </a>

    <div class="header">
      <h1>✏️ Create Note</h1>
      <p>Write something you want to keep private</p>
    </div>

    <div class="container">
      <div class="form-card">
        <form id="createForm">
          <div class="form-group">
            <label for="note">Your Note</label>
            <textarea
              name="note"
              id="note"
              placeholder="Write your private note here..."
              required
            ></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="name">Note Name</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="e.g., My Secret"
                required
              />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter a strong password"
                required
              />
            </div>
          </div>

          <button type="button" class="submit-btn" onclick="createNote()">
            Create Note
          </button>
        </form>

        <div class="status" id="status" style="display: none"></div>
      </div>
    </div>

    <script>
      async function createNote() {
        let noteText = document.getElementById("note").value;
        let noteName = document.getElementById("name").value;
        let notePass = document.getElementById("password").value;
        let statusEl = document.getElementById("status");

        if (noteText !== "" && noteName !== "" && notePass !== "") {
          statusEl.style.display = "flex";
          statusEl.className = "status info";
          statusEl.innerText = "Creating note...";

          let URL = "https://prive-note-server.vercel.app/api/create-note";
          let body = {
            name: noteName,
            password: notePass,
            note: noteText,
          };
          let reqOptions = {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          };

          try {
            const response = await fetch(URL, reqOptions);
            const data = await response.json();

            if (data.message === "Note created") {
              statusEl.className = "status success";
              statusEl.innerText = "✓ Note created successfully!";
              document.getElementById("note").value = "";
              document.getElementById("name").value = "";
              document.getElementById("password").value = "";
              setTimeout(() => {
                statusEl.style.display = "none";
              }, 3000);
            } else {
              statusEl.className = "status error";
              statusEl.innerText = "✗ " + data.message;
            }
          } catch (error) {
            console.error("Error creating note:", error);
            statusEl.className = "status error";
            statusEl.innerText = "✗ Error creating note";
          }
        } else {
          statusEl.style.display = "flex";
          statusEl.className = "status error";
          statusEl.innerText = "✗ Please fill all fields";
        }
      }
    </script>
  </body>
</html>
